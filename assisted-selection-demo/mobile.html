<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>代客选品</title><link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="entry.css?v=36"></head>
<body>
<div class="phone" id="app">
<header class="header"><div class="status" aria-hidden="true"><span class="clock">14:08 <i class="notification wechat">●</i> <i class="notification ding">➤</i> <i class="notification bili">▥</i></span><span class="signals">◴ ♩ ᛒ <small>1.70<br>KB/s</small><span class="cellular"><small>5G</small>▂▃▅▇</span><span class="wifi">◒</span><span class="battery"></span></span></div><div class="navbar"><button class="back" aria-label="返回" data-action="back"><span></span></button><h1>代客选品</h1><div class="capsule"><button aria-label="更多" data-action="more">•••</button><span></span><button aria-label="小程序首页" data-action="home"><i></i></button></div></div></header>
<main class="main"><div class="list-heading"><h2>选品清单 <span id="count"></span></h2><button class="muted" data-action="clear">清空</button><button class="blue" data-action="add">继续添加</button></div><div id="products"></div><section class="customer"><h2>客户信息</h2><div class="recognition"><button data-action="card"><svg viewBox="0 0 24 24"><path d="M2 3h20v18H2z"/><circle cx="12" cy="12" r="3.5"/><path d="M18 6h2"/></svg><span>名片识别</span></button><button data-action="text"><svg viewBox="0 0 24 24"><path d="M2 3h20v18H2zM6 9h5M6 14h11"/></svg><span>文本识别</span></button></div><form id="customer-form" novalidate><label class="field"><span>姓名<b>*</b></span><input id="name" autocomplete="name" placeholder="请输入姓名" required><button type="button" class="select-customer" data-action="customer">选择 <i class="chevron"></i></button></label><label class="field"><span>企业/品牌<b>*</b></span><input id="company" autocomplete="organization" placeholder="请输入企业/品牌" required></label><label class="field"><span>联系电话<b>*</b></span><input id="phone" type="tel" autocomplete="tel" placeholder="请输入联系电话" required></label></form></section></main>
<footer class="footer"><div class="footer-buttons"><button class="secondary" data-action="save">暂存</button><button class="primary" data-action="order">确认下单</button></div><div class="home-indicator"></div></footer>
<section id="advice-page" class="advice-page" hidden aria-label="修改内容" tabindex="-1"></section>
<div id="overlay" class="overlay" hidden><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="编辑选品" tabindex="-1"></section></div><div id="toast" class="toast" role="status" hidden></div>
</div><script src="config.js?v=10"></script><script src="app.js?v=63"></script></body></html>
