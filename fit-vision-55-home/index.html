<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitVision 55-inch Home Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="kiosk-viewport">
      <main class="kiosk-stage home-page">
        <section class="home-page__hero" aria-labelledby="home-title">
          <div class="home-page__brand">
            <h1 id="home-title">感臻智能AI换装</h1>
          </div>

          <p class="home-page__description">知型，才能有型。先懂自己，再选衣服</p>

          <nav class="home-page__entries" aria-label="主要功能">
            <button class="home-entry-card" type="button">
              <span class="home-entry-card__icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <rect x="7" y="9" width="18" height="16" rx="3" />
                  <path d="M12 9V7h8v2M12 16h8M12 20h5" />
                </svg>
              </span>
              <span class="home-entry-card__content">
                <strong>生成美学报告</strong>
                <span>整理轮廓、色彩与风格线索，生成专属穿搭建议。</span>
              </span>
              <span class="home-entry-card__arrow" aria-hidden="true">›</span>
            </button>

            <button class="home-entry-card" type="button">
              <span class="home-entry-card__icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M11 9 7 13l4 4 2-2v10h6V15l2 2 4-4-4-4-4 2h-2l-4-2Z" />
                </svg>
              </span>
              <span class="home-entry-card__content">
                <strong>创建试穿形象</strong>
                <span>拍照创建形象，自选款式并预览上身效果。</span>
              </span>
              <span class="home-entry-card__arrow" aria-hidden="true">›</span>
            </button>
          </nav>
        </section>

        <p class="home-page__support">
          <span>AI 形象美学体验</span>
          <span class="home-page__company-full">深圳感臻智能股份有限公司</span>
        </p>
      </main>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
